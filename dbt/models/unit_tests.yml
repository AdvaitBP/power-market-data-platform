version: 2
unit_tests:
  - name: lmp_contents_successful_run_eligibility
    model: stg_lmp_contents
    given:
      - input: source('raw', 'lmp_contents')
        rows:
          - {content_id: synthetic_accepted, first_run_id: run_ok}
          - {content_id: synthetic_unfinalized, first_run_id: run_committed}
          - {content_id: synthetic_failed, first_run_id: run_failed}
          - {content_id: synthetic_started, first_run_id: run_started}
      - input: ref('stg_ingestion_runs')
        rows:
          - {run_id: run_ok, status: SUCCEEDED}
          - {run_id: run_committed, status: COMMITTED}
          - {run_id: run_failed, status: FAILED}
          - {run_id: run_started, status: STARTED}
    expect:
      rows:
        - {content_id: synthetic_accepted}
  - name: lmp_state_transitions_successful_run_eligibility
    model: stg_lmp_state_transitions
    given:
      - input: source('raw', 'lmp_state_transitions')
        rows:
          - {transition_id: synthetic_accepted, run_id: run_ok}
          - {transition_id: synthetic_unfinalized, run_id: run_committed}
          - {transition_id: synthetic_failed, run_id: run_failed}
          - {transition_id: synthetic_started, run_id: run_started}
      - input: ref('stg_ingestion_runs')
        rows:
          - {run_id: run_ok, status: SUCCEEDED}
          - {run_id: run_committed, status: COMMITTED}
          - {run_id: run_failed, status: FAILED}
          - {run_id: run_started, status: STARTED}
    expect:
      rows:
        - {transition_id: synthetic_accepted}
  - name: lmp_history_preserves_reappearing_content
    model: int_lmp_revision_history
    given:
      - input: ref('stg_lmp_contents')
        rows:
          - {content_id: synthetic_A, logical_key: synthetic_key, content_hash: hash_A, lmp: 10}
          - {content_id: synthetic_B, logical_key: synthetic_key, content_hash: hash_B, lmp: 20}
      - input: ref('stg_lmp_state_transitions')
        rows:
          - {transition_id: t1, content_id: synthetic_A, ordinal: 1, commit_sequence: 1}
          - {transition_id: t2, content_id: synthetic_B, ordinal: 2, commit_sequence: 3}
          - {transition_id: t3, content_id: synthetic_A, ordinal: 3, commit_sequence: 4}
    expect:
      rows:
        - {transition_id: t1, content_id: synthetic_A, state_ordinal: 1, lmp: 10}
        - {transition_id: t2, content_id: synthetic_B, state_ordinal: 2, lmp: 20}
        - {transition_id: t3, content_id: synthetic_A, state_ordinal: 3, lmp: 10}
  - name: load_contents_successful_run_eligibility
    model: stg_load_contents
    given:
      - input: source('raw', 'load_contents')
        rows:
          - {content_id: synthetic_accepted, first_run_id: run_ok}
          - {content_id: synthetic_unfinalized, first_run_id: run_committed}
          - {content_id: synthetic_failed, first_run_id: run_failed}
          - {content_id: synthetic_started, first_run_id: run_started}
      - input: ref('stg_ingestion_runs')
        rows:
          - {run_id: run_ok, status: SUCCEEDED}
          - {run_id: run_committed, status: COMMITTED}
          - {run_id: run_failed, status: FAILED}
          - {run_id: run_started, status: STARTED}
    expect:
      rows:
        - {content_id: synthetic_accepted}
  - name: load_state_transitions_successful_run_eligibility
    model: stg_load_state_transitions
    given:
      - input: source('raw', 'load_state_transitions')
        rows:
          - {transition_id: synthetic_accepted, run_id: run_ok}
          - {transition_id: synthetic_unfinalized, run_id: run_committed}
          - {transition_id: synthetic_failed, run_id: run_failed}
          - {transition_id: synthetic_started, run_id: run_started}
      - input: ref('stg_ingestion_runs')
        rows:
          - {run_id: run_ok, status: SUCCEEDED}
          - {run_id: run_committed, status: COMMITTED}
          - {run_id: run_failed, status: FAILED}
          - {run_id: run_started, status: STARTED}
    expect:
      rows:
        - {transition_id: synthetic_accepted}
  - name: load_history_preserves_reappearing_content
    model: int_load_revision_history
    given:
      - input: ref('stg_load_contents')
        rows:
          - {content_id: synthetic_A, logical_key: synthetic_key, content_hash: hash_A, load: 10}
          - {content_id: synthetic_B, logical_key: synthetic_key, content_hash: hash_B, load: 20}
      - input: ref('stg_load_state_transitions')
        rows:
          - {transition_id: t1, content_id: synthetic_A, ordinal: 1, commit_sequence: 1}
          - {transition_id: t2, content_id: synthetic_B, ordinal: 2, commit_sequence: 3}
          - {transition_id: t3, content_id: synthetic_A, ordinal: 3, commit_sequence: 4}
    expect:
      rows:
        - {transition_id: t1, content_id: synthetic_A, state_ordinal: 1, load: 10}
        - {transition_id: t2, content_id: synthetic_B, state_ordinal: 2, load: 20}
        - {transition_id: t3, content_id: synthetic_A, state_ordinal: 3, load: 10}
  - name: daily_summary_pacific_dst_days
    model: mart_daily_lmp_summary
    given:
      - input: ref('fct_hourly_lmp')
        rows:
          - {source: CAISO, market: DAY_AHEAD_HOURLY, location: TH_NP15_GEN-APND, market_date: '2026-03-08', lmp: -5}
          - {source: CAISO, market: DAY_AHEAD_HOURLY, location: TH_NP15_GEN-APND, market_date: '2026-11-01', lmp: 10}
    expect:
      rows:
        - {market_date: '2026-03-08', observation_count: 1, expected_hour_count: 23, negative_price_interval_count: 1}
        - {market_date: '2026-11-01', observation_count: 1, expected_hour_count: 25, negative_price_interval_count: 0}
