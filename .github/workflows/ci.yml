name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,optimization]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test installed package
        run: python -m pytest
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import power_market_data; print(power_market_data.__version__)"
          python -m pytest
      - name: Install isolated dbt tooling
        run: |
          python -m venv artifacts/dbt-core-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            DBT_BIN=artifacts/dbt-core-venv/Scripts
          else
            DBT_BIN=artifacts/dbt-core-venv/bin
          fi
          "$DBT_BIN/python" -m pip install -r dbt/requirements.txt
          "$DBT_BIN/python" -m pip check
          "$DBT_BIN/python" dbt/tooling/check_cost_cap.py
          cp dbt/profiles.example.yml dbt/profiles.yml
          echo "DBT_BIN=$DBT_BIN" >> "$GITHUB_ENV"
      - name: Parse dbt project without credentials
        env:
          GCP_PROJECT_ID: offline-project
          GOOGLE_APPLICATION_CREDENTIALS: deliberately-missing-credentials.json
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: '"$DBT_BIN/dbt" parse --project-dir dbt --profiles-dir dbt'
      - name: Install isolated Flyte tooling
        run: |
          python -m venv artifacts/flyte-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            FLYTE_BIN=artifacts/flyte-venv/Scripts
          else
            FLYTE_BIN=artifacts/flyte-venv/bin
          fi
          "$FLYTE_BIN/python" -m pip install -e ".[dev]" -r orchestration/requirements.txt
          "$FLYTE_BIN/python" -m pip check
          echo "FLYTE_BIN=$FLYTE_BIN" >> "$GITHUB_ENV"
      - name: Type-check and execute the native local Flyte graph
        env:
          PYTHONUTF8: "1"
          GOOGLE_APPLICATION_CREDENTIALS: deliberately-missing-credentials.json
        run: |
          "$FLYTE_BIN/python" -m mypy orchestration orchestration_checks orchestration_integration_tests
          "$FLYTE_BIN/python" -m pytest orchestration_checks orchestration_integration_tests
